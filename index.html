<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Text Rotate Only</title>

<style>
    body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    /* หัวใจไม่หมุน */
    #heart-wrapper {
        width: 500px;
        height: 500px;
    }

    #ui {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .love_word {
        position: absolute;
        color: #ea80b0;
        font-size: 1.4rem;
        letter-spacing: 2px;
        white-space: nowrap;
        text-shadow: 0 0 10px #fff;
        transform-origin: center;
        animation: rotateText 6s linear infinite;
        transform: rotateY(360deg);
    }

    /* หมุนเฉพาะข้อความ */
    @keyframes rotateText {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes rotate3D {
    from {
        transform: rotateY(0deg);
    }
    to {
        transform: rotateY(360deg);
    }
}

</style>
</head>

<body>

<div id="heart-wrapper">
    <div id="ui"></div>
</div>

<script>
    const ui = document.getElementById("ui");
    const text = "I love you";
    const points = 120;

    for (let i = 0; i < points; i++) {
        const t = (Math.PI * 2 * i) / points;

        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        const span = document.createElement("div");
        span.className = "love_word";
        span.innerText = text;

        span.style.left = 200 + x * 8 + "px";
        span.style.top  = 200 - y * 8 + "px";

        /* หมุนไม่พร้อมกัน ดูมีมิติ */
        span.style.animationDelay = `${i * 0.03}s`;

        ui.appendChild(span);
    }
</script>

</body>
</html>
